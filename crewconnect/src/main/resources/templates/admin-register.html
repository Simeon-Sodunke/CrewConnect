<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User | CrewConnect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        function toggleManagerSelect() {
            var role = document.getElementById('role').value;
            var section = document.getElementById('manager-section');
            if (role === 'EMPLOYEE') {
                section.classList.remove('hidden');
            } else {
                section.classList.add('hidden');
                // also clear a previously chosen manager if switching away from EMPLOYEE
                var sel = document.getElementById('managerId');
                if (sel) sel.value = '';
            }
        }
        document.addEventListener('DOMContentLoaded', toggleManagerSelect);
    </script>
</head>

<body class="bg-[#F9F9F9] text-[#2C2C2C] font-inter antialiased">
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <a th:href="@{/}" class="text-2xl font-bold text-[#0D3B66]">
            <span class="text-[#D99A26]">Crew</span>Connect
        </a>
        <nav class="hidden md:flex gap-6 text-base font-medium">
            <a th:href="@{/admin}" class="hover:text-[#D99A26]">Dashboard</a>
            <a th:href="@{/admin/users}" class="hover:text-[#D99A26]">Users</a>
            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="hover:text-[#D99A26] bg-transparent border-0 cursor-pointer">Logout</button>
            </form>
        </nav>
    </div>
</header>

<main class="max-w-3xl mx-auto mt-8 px-6">
    <div class="bg-white rounded-xl shadow p-6">
        <h1 class="text-2xl font-semibold mb-4">Add User</h1>

        <div th:if="${error}" class="mb-4 p-3 rounded bg-red-100 text-red-800" th:text="${error}"></div>
        <div th:if="${msg}" class="mb-4 p-3 rounded bg-green-100 text-green-800" th:text="${msg}"></div>

        <form th:action="@{/admin/register}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${error}" class="mb-4 rounded-lg bg-red-50 text-red-700 border border-red-200 px-4 py-3">
                <span th:text="${error}">Something went wrong.</span>
            </div>

            <div th:if="${msg}" class="mb-4 rounded-lg bg-green-50 text-green-700 border border-green-200 px-4 py-3">
                <span th:text="${msg}">Success.</span>
            </div>

            <!-- Role -->
            <div class="md:col-span-2">
                <label for="role" class="block text-sm font-medium mb-1">Role</label>
                <select id="role" name="role" class="w-full border rounded px-3 py-2" onchange="toggleManagerSelect()">
                    <option value="EMPLOYEE">EMPLOYEE</option>
                    <option value="MANAGER">MANAGER</option>
                </select>
            </div>

            <!-- Name -->
            <div>
                <label class="block text-sm font-medium mb-1">First name</label>
                <input type="text" name="firstname" class="w-full border rounded px-3 py-2" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Last name</label>
                <input type="text" name="lastname" class="w-full border rounded px-3 py-2" required>
            </div>

            <!-- Email / Username -->
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" name="email" class="w-full border rounded px-3 py-2" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" name="username" class="w-full border rounded px-3 py-2" required>
            </div>

            <!-- Password -->
            <div class="md:col-span-2">
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" name="password" class="w-full border rounded px-3 py-2" required>
            </div>

            <!-- Manager (only when role = EMPLOYEE) -->
            <div id="manager-section" class="md:col-span-2 hidden">
                <label class="block text-sm font-medium mb-1">Assign Manager</label>
                <select id="managerId" name="managerId" class="w-full border rounded px-3 py-2">
                    <option value="">— Select Manager —</option>
                    <option th:each="m : ${managers}"
                            th:value="${m.managerID}"
                            th:text="${m.firstname + ' ' + m.lastname}">
                    </option>
                </select>
                <p class="mt-2 text-xs text-gray-500">Optional: leave blank if this employee doesn’t have a manager.</p>
            </div>

            <!-- Address / Phone -->
            <div class="md:col-span-2">
                <label class="block text-sm font-medium mb-1">Address</label>
                <input type="text" name="address" class="w-full border rounded px-3 py-2">
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium mb-1">Phone</label>
                <input type="text" name="phonenumber" class="w-full border rounded px-3 py-2">
            </div>

            <div class="md:col-span-2 mt-2 flex gap-3">
                <button type="submit" class="bg-[#D99A26] text-white px-4 py-2 rounded hover:bg-[#C48A1F]">Create User</button>
                <a th:href="@{/admin/users}" class="px-4 py-2 rounded border">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer class="py-8 bg-[#0D3B66] text-white text-center mt-12">
    <p class="text-sm opacity-90">© 2025 CrewConnect</p>
</footer>
</body>
</html>
