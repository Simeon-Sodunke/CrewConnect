<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Password | CrewConnect</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-[#F9F9F9] text-[#2C2C2C] font-inter antialiased">

<header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-gray-200">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a th:href="@{/}" class="text-2xl font-bold text-[#0D3B66]">
      <span class="text-[#D99A26]">Crew</span>Connect
    </a>
  </div>
</header>

<main class="max-w-md mx-auto mt-10 px-6">
  <div class="bg-white rounded-2xl shadow p-6">
    <h1 class="text-2xl font-semibold text-[#0D3B66] mb-2">
      Set your password
    </h1>
    <p class="text-sm text-gray-600 mb-4">
      For security reasons, you need to set a new password before using CrewConnect.
    </p>

    <!-- Error / success messages -->
    <div th:if="${error}" class="mb-4 rounded-lg bg-red-50 text-red-700 border border-red-200 px-4 py-3">
      <span th:text="${error}">Something went wrong.</span>
    </div>
    <div th:if="${msg}" class="mb-4 rounded-lg bg-green-50 text-green-700 border border-green-200 px-4 py-3">
      <span th:text="${msg}">Password updated.</span>
    </div>

    <!-- IMPORTANT: action + field names MUST match controller -->
    <form th:action="@{/password/set}" method="post" class="space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <!-- New password -->
      <div>
        <label class="block text-sm font-medium mb-1" for="password">New password</label>
        <input id="password"
               type="password"
               name="password"
               class="w-full border rounded px-3 py-2"
               required>
      </div>

      <!-- Confirm password -->
      <div>
        <label class="block text-sm font-medium mb-1" for="confirmPassword">Confirm password</label>
        <input id="confirmPassword"
               type="password"
               name="confirmPassword"
               class="w-full border rounded px-3 py-2"
               required>
      </div>

      <p class="text-xs text-gray-500">
        Password must be at least 8 characters. Use a mix of letters, numbers, and symbols if possible.
      </p>

      <div class="pt-2">
        <button type="submit"
                class="w-full bg-[#D99A26] text-white py-2 rounded-lg font-medium hover:bg-[#C48A1F]">
          Save password
        </button>
      </div>
    </form>
  </div>
</main>

<footer class="py-8 bg-[#0D3B66] text-white text-center mt-12">
  <p class="text-sm opacity-90">© 2025 CrewConnect</p>
</footer>

</body>
</html>
