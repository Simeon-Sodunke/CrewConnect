<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'My Employees'">My Employees</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-[#F9F9F9] text-[#2C2C2C] font-inter">
<header class="sticky top-0 bg-white border-b">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a th:href="@{/}" class="text-2xl font-bold text-[#0D3B66]"><span class="text-[#D99A26]">Crew</span>Connect</a>
        <nav class="flex gap-6 font-medium">
            <a th:href="@{/manager}" class="hover:text-[#D99A26]">Dashboard</a>
            <a th:href="@{/manager/employees}" class="text-[#D99A26]">My Employees</a>
            <a th:href="@{/profile}" class="hover:text-[#D99A26]">My Profile</a>
            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        class="bg-[#D99A26] text-white px-4 py-2 rounded-lg font-semibold hover:bg-[#C48A1F] transition">
                    Logout
                </button>
            </form>
        </nav>
    </div>
</header>

<section class="max-w-7xl mx-auto px-6 py-10">
    <h1 class="text-3xl font-bold text-[#0D3B66]" th:text="'Employees for ' + ${manager.firstname} + ' ' + ${manager.lastname}">My Employees</h1>

    <div class="mt-6 bg-white rounded-xl shadow overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-[#0D3B66] text-white">
            <tr>
                <th class="py-3 px-4 text-left w-[8%]">#</th>
                <th class="py-3 px-4 text-left w-[26%]">Name</th>
                <th class="py-3 px-4 text-left w-[28%]">Email</th>
                <th class="py-3 px-4 text-left w-[18%]">Username</th>
                <th class="py-3 px-4 text-left w-[20%]">Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e, iStat : ${employees}" class="border-t">
                <td class="py-3 px-4" th:text="${iStat.index + 1}">1</td>
                <td class="py-3 px-4" th:text="${(e.firstname ?: '') + ' ' + (e.lastname ?: '')}">Name</td>
                <td class="py-3 px-4" th:text="${e.email}">email@example.com</td>
                <td class="py-3 px-4" th:text="${e.username}">username</td>
                <td class="py-3 px-4">
            <span class="px-2 py-1 rounded text-xs font-semibold"
                  th:text="${e.mustChangePassword} ? 'Must Reset Password' : 'Active'"
                  th:classappend="${e.mustChangePassword} ? 'bg-yellow-100 text-yellow-800' : 'bg-green-100 text-green-800'">
              Active
            </span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="5" class="py-6 px-4 text-center text-gray-500">No employees assigned.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

<footer class="py-8 bg-[#0D3B66] text-white text-center">
    <p class="text-sm opacity-90">© 2025 CrewConnect</p>
</footer>
</body>
</html>
