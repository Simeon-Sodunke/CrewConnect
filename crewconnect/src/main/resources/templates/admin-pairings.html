<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upcoming Pairings | CrewConnect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-[#F9F9F9] text-[#2C2C2C] font-inter antialiased">

<header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
        <a th:href="@{/admin}" class="text-2xl font-bold text-[#0D3B66]">
            <span class="text-[#D99A26]">Crew</span>Connect
        </a>
        <nav class="hidden md:flex gap-6 text-base font-medium">
            <a th:href="@{/admin}" class="hover:text-[#D99A26]">Home</a>
            <a th:href="@{/profile}" class="hover:text-[#D99A26]">My Profile</a>
            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit"
                        class="bg-[#D99A26] text-white px-4 py-2 rounded-lg font-semibold hover:bg-[#C48A1F] transition">
                    Logout
                </button>
            </form>
        </nav>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-[#0D3B66]">Upcoming Pairings</h1>
        <a th:href="@{/admin}" class="text-sm text-[#0D3B66] hover:underline">← Back to Dashboard</a>
    </div>

    <div class="bg-white rounded-2xl shadow p-6 overflow-x-auto">
        <table class="w-full text-sm">
            <thead class="bg-[#0D3B66] text-white">
            <tr>
                <th class="px-4 py-3 text-left">Employee A</th>
                <th class="px-4 py-3 text-left">Employee B</th>
                <th class="px-4 py-3 text-left">Start</th>
                <th class="px-4 py-3 text-left">End</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pairings}" class="border-t hover:bg-gray-50">
                <td class="px-4 py-2" th:text="${p.employeeA.firstname + ' ' + p.employeeA.lastname}">Alice Smith</td>
                <td class="px-4 py-2" th:text="${p.employeeB.firstname + ' ' + p.employeeB.lastname}">Bob Jones</td>
                <td class="px-4 py-2"
                    th:text="${#temporals.format(p.start, 'yyyy-MM-dd HH:mm')}">2025-11-20 09:00</td>
                <td class="px-4 py-2"
                    th:text="${#temporals.format(p.end, 'yyyy-MM-dd HH:mm')}">2025-11-20 10:00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(pairings)}">
                <td colspan="4" class="px-4 py-6 text-center text-gray-500">
                    No upcoming pairings scheduled.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="py-8 bg-[#0D3B66] text-white text-center mt-12">
    <p class="text-sm opacity-90">© 2025 CrewConnect</p>
</footer>

</body>
</html>
